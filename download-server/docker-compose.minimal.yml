services:
  download-server:
    build:
      context: .
      dockerfile: Dockerfile.minimal
    container_name: piko-download-server
    restart: unless-stopped
    ports:
      - "7788:7788"
    environment:
      DOWNLOAD_SERVER_HOST: "0.0.0.0"
      DOWNLOAD_SERVER_PORT: "7788"
      DOWNLOAD_SERVER_DATA_DIR: "/data/.pikpak/downloader"
    volumes:
      - ./data:/data
