name: Download Server

on:
  push:
    paths:
      - "download-server/**"
      - ".github/workflows/download-server.yml"
  pull_request:
    paths:
      - "download-server/**"
      - ".github/workflows/download-server.yml"
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: download-server/web/package-lock.json

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache-dependency-path: download-server/go.sum

      - name: Build Web frontend
        working-directory: download-server/web
        run: |
          npm ci
          npm run build

      - name: Check formatting
        working-directory: download-server
        run: test -z "$(gofmt -l .)"

      - name: Run unit and integration tests
        working-directory: download-server
        run: go test -race ./...

      - name: Build server binary
        working-directory: download-server
        run: |
          go test -tags embed_ui ./internal/web/...
          CGO_ENABLED=0 go build -tags embed_ui ./cmd/server
