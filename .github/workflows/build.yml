name: Build

# Fork/本地验证用的全平台构建：只负责产出安装包，不跑安装、更新冒烟。
# 正式发版仍走 release.yml。所有 job 使用 SDK main 源码，避免依赖尚未发布的 SDK 版本。
#
# 两种用法：
# 1. 推一个 test-* tag（如 test-20261111-vr）：默认只打 Android，完成后自动建一个
#    Pre-release，手机上点链接就能装。tag 里带 desktop（如 test-20261111-vr-desktop）
#    才额外打 Windows x64 / macOS / Linux，桌面改动需要验证时再要。
# 2. 手动触发：只跑构建、把产物留在 workflow 的 Artifacts 里（保留 7 天），不建 Release。
#    适合只想拿某一个平台的包、或先确认能编过再打 tag。
on:
  push:
    tags:
      - 'test-*'
  workflow_dispatch:
    inputs:
      version:
        description: 构建版本号（MAJOR.MINOR.PATCH）
        required: true
        default: '9.9.9'
      suffix:
        description: 版本后缀（可空），如 vr，产物记为 9.9.9-vr
        required: false
        default: ''
      platforms:
        description: 构建平台
        type: choice
        options:
          - android
          - desktop
          - all
        default: android

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.derive.outputs.name }}
      code: ${{ steps.derive.outputs.code }}
      base: ${{ steps.derive.outputs.base }}
      title: ${{ steps.derive.outputs.title }}
      android: ${{ steps.derive.outputs.android }}
      desktop: ${{ steps.derive.outputs.desktop }}
    steps:
      - name: Derive version
        id: derive
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_SUFFIX: ${{ inputs.suffix }}
          INPUT_PLATFORMS: ${{ inputs.platforms }}
        run: |
          base="${INPUT_VERSION:-9.9.9}"
          suffix="$INPUT_SUFFIX"
          platforms="${INPUT_PLATFORMS:-android}"
          title=""
          if [[ "$EVENT" == "push" ]]; then
            # test-20261111-vr → 后缀 20261111-vr，标题带上可读的日期与说明；
            # 只有 tag 里带 desktop 才连桌面端一起打包，日常验证只出 Android 更快。
            if [[ ! "$TAG" =~ ^test-(.+)$ ]]; then
              echo "Test tags must use test-<slug> format."
              exit 1
            fi
            suffix="${BASH_REMATCH[1]}"
            [[ "$suffix" == *desktop* ]] && platforms="all"
            if [[ "$suffix" =~ ^([0-9]{4})([0-9]{2})([0-9]{2})-(.+)$ ]]; then
              title="${BASH_REMATCH[1]}-${BASH_REMATCH[2]}-${BASH_REMATCH[3]}（${BASH_REMATCH[4]}）"
            else
              title="$suffix"
            fi
          fi
          if [[ ! "$base" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "Version must use MAJOR.MINOR.PATCH"
            exit 1
          fi
          major=$((10#${BASH_REMATCH[1]}))
          minor=$((10#${BASH_REMATCH[2]}))
          patch=$((10#${BASH_REMATCH[3]}))
          name="$base"
          if [[ -n "$suffix" ]]; then
            if [[ ! "$suffix" =~ ^[A-Za-z0-9._-]+$ ]]; then
              echo "Suffix may only contain letters, digits, dot, underscore and dash."
              exit 1
            fi
            name="$base-$suffix"
            [[ -z "$title" ]] && title="$suffix"
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$((major * 1000000 + minor * 1000 + patch))" >> "$GITHUB_OUTPUT"
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "title=${title:-$name}" >> "$GITHUB_OUTPUT"
          echo "android=$([[ "$platforms" != "desktop" ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "desktop=$([[ "$platforms" != "android" ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  android:
    needs: version
    if: needs.version.outputs.android == 'true'
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/piko-release.jks
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      PIKO_VERSION_NAME: ${{ needs.version.outputs.name }}
      PIKO_VERSION_CODE: ${{ needs.version.outputs.code }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/checkout@v5
        with:
          repository: NihilDigit/pikpak-kotlin
          path: pikpak-kotlin

      - name: Build against the SDK source
        shell: bash
        run: echo "pikpak.sdk.dir=pikpak-kotlin" >> local.properties

      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v5

      - name: Decode signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          chmod 600 "$ANDROID_KEYSTORE_PATH"

      - name: Build signed APKs
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Collect artifacts
        run: |
          mkdir -p dist
          for apk in app/build/outputs/apk/release/*.apk; do
            variant=$(basename "$apk" | sed -E 's/^app-(.*)-release\.apk$/\1/')
            cp "$apk" "dist/piko-$PIKO_VERSION_NAME-$variant.apk"
          done
          cp app/build/outputs/mapping/release/mapping.txt "dist/piko-$PIKO_VERSION_NAME-mapping.txt"
          ls -lh dist

      - uses: actions/upload-artifact@v6
        with:
          name: android-dist
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  windows:
    needs: version
    if: needs.version.outputs.desktop == 'true'
    runs-on: windows-latest
    env:
      # MSI/DMG 的版本号必须是纯数字：后缀只用于文件名，不写进包内版本
      ORG_GRADLE_PROJECT_pikoDesktopVersion: ${{ needs.version.outputs.base }}
      VERSION: ${{ needs.version.outputs.name }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/checkout@v5
        with:
          repository: NihilDigit/pikpak-kotlin
          path: pikpak-kotlin

      - name: Build against the SDK source
        shell: bash
        run: echo "pikpak.sdk.dir=pikpak-kotlin" >> local.properties

      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: zulu

      - uses: gradle/actions/setup-gradle@v5

      - name: Install WiX Toolset
        continue-on-error: true
        run: choco install wixtoolset -y --no-progress

      - name: Build application image and MSI
        run: .\gradlew.bat :desktopApp:createReleaseDistributable :desktopApp:packageReleaseMsi --stacktrace

      - name: Collect artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $binaries = 'desktopApp/build/compose/binaries/main-release'
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          & .github/scripts/pack-portable.ps1 -AppDir "$binaries/app/Piko" -Output "dist/piko-windows-x64-$env:VERSION.7z"
          $msi = Get-ChildItem "$binaries/msi/*.msi" | Select-Object -First 1
          if (-not $msi) { throw 'packageReleaseMsi 没有产出 MSI' }
          Copy-Item $msi.FullName "dist/piko-windows-x64-$env:VERSION.msi"
          Get-ChildItem dist | Format-Table Name, Length

      - uses: actions/upload-artifact@v6
        with:
          name: windows-x64-dist
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  macos:
    needs: version
    if: needs.version.outputs.desktop == 'true'
    runs-on: macos-15
    env:
      ORG_GRADLE_PROJECT_pikoDesktopVersion: ${{ needs.version.outputs.base }}
      VERSION: ${{ needs.version.outputs.name }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/checkout@v5
        with:
          repository: NihilDigit/pikpak-kotlin
          path: pikpak-kotlin

      - name: Build against the SDK source
        shell: bash
        run: echo "pikpak.sdk.dir=pikpak-kotlin" >> local.properties

      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: zulu

      - uses: gradle/actions/setup-gradle@v5

      - name: Build DMG
        run: ./gradlew :desktopApp:packageReleaseDmg --no-daemon --stacktrace

      - name: Collect artifacts
        run: |
          set -euo pipefail
          dmg=$(ls desktopApp/build/compose/binaries/main-release/dmg/*.dmg | head -n 1)
          mkdir -p dist
          cp "$dmg" "dist/piko-macos-arm64-$VERSION.dmg"
          ls -lh dist

      - uses: actions/upload-artifact@v6
        with:
          name: macos-dist
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  linux:
    needs: version
    if: needs.version.outputs.desktop == 'true'
    runs-on: ubuntu-24.04
    env:
      ORG_GRADLE_PROJECT_pikoDesktopVersion: ${{ needs.version.outputs.base }}
      VERSION: ${{ needs.version.outputs.name }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/checkout@v5
        with:
          repository: NihilDigit/pikpak-kotlin
          path: pikpak-kotlin

      - name: Build against the SDK source
        shell: bash
        run: echo "pikpak.sdk.dir=pikpak-kotlin" >> local.properties

      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: zulu

      - uses: gradle/actions/setup-gradle@v5

      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends zsync appstream desktop-file-utils xvfb

      - name: Build AppImage
        run: xvfb-run -a ./gradlew :desktopApp:packageReleaseAppImage --no-daemon --stacktrace

      - name: Collect artifacts
        run: |
          set -euo pipefail
          mkdir -p dist
          # 包内版本是纯数字的基座版本，文件名才带测试后缀
          src=$(ls desktopApp/build/compose/binaries/main-release/appimage/piko-linux-x64-*.AppImage | head -n 1)
          cp "$src" "dist/piko-linux-x64-$VERSION.AppImage"
          if [ -f "$src.zsync" ]; then cp "$src.zsync" "dist/piko-linux-x64-$VERSION.AppImage.zsync"; fi
          ls -lh dist
          test -x "dist/piko-linux-x64-$VERSION.AppImage"

      - uses: actions/upload-artifact@v6
        with:
          name: linux-dist
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  # 推 test-* tag 时把产物汇总成一个 Pre-release，手机与桌面点开就能下载。
  # 手动触发不跑这里：产物留在 Artifacts 里，避免「只是编一下」被当成一次发布。
  # 没构建的桌面 job 会被跳过，所以这里用 always() + 结果检查，而不是默认的 needs 全成功。
  publish:
    if: always() && github.event_name == 'push' && !cancelled() && !contains(needs.*.result, 'failure')
    needs: [version, android, windows, macos, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          path: dist
          merge-multiple: true

      - name: Create pre-release
        env:
          # 仓库的 Workflow permissions 为只读时 github.token 建不了 Release；
          # 配了 RELEASE_TOKEN（带 contents: write 的 PAT）就用它
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.version.outputs.name }}
          TITLE: ${{ needs.version.outputs.title }}
        run: |
          set -euo pipefail
          ls -lh dist
          (cd dist && sha256sum * > SHA256SUMS.txt)
          cat > notes.md <<EOF
          测试构建，未跑安装与更新冒烟，仅用于验证功能。版本 \`$VERSION\`，tag \`$TAG\`。

          - Android：按 ABI 区分的 APK；签名与之前的测试包一致时可直接覆盖安装。
          - 桌面端（tag 带 \`desktop\` 或手动选择时才构建）：Windows x64 的 7z / MSI、macOS arm64 DMG、Linux x64 AppImage。

          测试包不进正式更新通道；应用内若提示了新版本，按提示升级即可。
          EOF
          # 失败 job 重跑时 release 可能已经建好，补传附件即可，不重复创建
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "Piko 测试构建 ${TITLE}" \
              --notes-file notes.md \
              --prerelease
          fi
