<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Piko · 移动端预览</title>
<style>
  :root {
    --bg: #f9f9fe;
    --sheet: #f1f0f8;
    --surface: #ececf5;
    --tile: #e3e5f0;
    --tile-strong: #dcdfec;
    --text: #1b1b21;
    --muted: #5f606b;
    --muted-2: #777986;
    --line: #d7d8e3;
    --primary: #4b5db8;
    --primary-soft: #dde3ff;
    --on-primary-soft: #27357e;
    --error-soft: #f8dade;
    --error: #8b1e2d;
    --scrim: rgba(20, 18, 30, .44);
    --shadow: rgba(35, 30, 55, .22);
    --hero: #11101a;
  }
  body[data-theme="dark"] {
    --bg: #111018;
    --sheet: #1b1a22;
    --surface: #24222d;
    --tile: #2a2834;
    --tile-strong: #322f3e;
    --text: #efedf5;
    --muted: #b1adbe;
    --muted-2: #8e899a;
    --line: #383544;
    --primary: #c6ccff;
    --primary-soft: #343a67;
    --on-primary-soft: #e2e5ff;
    --error-soft: #54252f;
    --error: #ffb3bd;
    --scrim: rgba(0, 0, 0, .58);
    --shadow: rgba(0, 0, 0, .55);
    --hero: #08070c;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    color: var(--text);
    font-family: "Noto Sans CJK SC", "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; }
  .i {
    width: 20px;
    height: 20px;
    flex: none;
    stroke: currentColor;
    fill: none;
    stroke-width: 1.8;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .i.fill { fill: currentColor; stroke: none; }

  .screen {
    position: relative;
    width: 412px;
    height: 892px;
    overflow: hidden;
    background: var(--bg);
  }

  /* list behind the sheet */
  .list {
    position: absolute;
    inset: 0;
    padding: 22px 16px 0;
  }
  .list-head {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .list-title { flex: 1; min-width: 0; }
  .list-title h1 {
    margin: 0;
    font-size: 24px;
    line-height: 31px;
    font-weight: 650;
    letter-spacing: -.02em;
  }
  .list-title p {
    margin: 1px 0 0;
    font-size: 12px;
    line-height: 16px;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .circle, .count {
    display: grid;
    place-items: center;
    flex: none;
    background: var(--surface);
    border-radius: 50%;
  }
  .circle { width: 40px; height: 40px; }
  .count {
    width: 36px;
    height: 36px;
    border-radius: 11px;
    border: 1px solid var(--line);
    background: transparent;
    font-size: 14px;
    font-weight: 600;
  }
  .pills {
    display: flex;
    gap: 6px;
    margin-top: 16px;
    white-space: nowrap;
  }
  .pill {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 7px 10px;
    border-radius: 999px;
    background: var(--surface);
    color: var(--muted);
    font-size: 12px;
    font-weight: 500;
  }
  .pill .i { width: 14px; height: 14px; }
  .pill.on { background: var(--primary-soft); color: var(--on-primary-soft); }
  .sort {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: 14px;
    font-size: 13px;
    font-weight: 550;
  }
  .sort .i { width: 18px; height: 18px; color: var(--muted); }
  .sort .gap { width: 12px; }
  .sort .right { margin-left: auto; }
  .grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-top: 12px;
  }
  .folder {
    border-radius: 12px;
    aspect-ratio: 1.45;
    display: grid;
    place-items: center;
    background: var(--surface);
    color: color-mix(in srgb, var(--primary) 38%, var(--surface));
  }
  .folder .i { width: 31px; height: 31px; }
  .folder-label {
    margin-top: 5px;
    font-size: 13px;
    line-height: 18px;
    font-weight: 520;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .scrim {
    position: absolute;
    inset: 0;
    background: var(--scrim);
    backdrop-filter: blur(2px);
  }

  /* bottom preview sheet */
  .sheet {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 80%;
    display: flex;
    flex-direction: column;
    border-radius: 30px 30px 0 0;
    background: var(--sheet);
    box-shadow: 0 -22px 60px var(--shadow);
    overflow: hidden;
    padding-bottom: 10px;
  }
  .handle {
    height: 22px;
    display: grid;
    place-items: center;
    flex: none;
  }
  .handle::after {
    content: "";
    width: 36px;
    height: 4px;
    border-radius: 99px;
    background: var(--muted-2);
    opacity: .42;
  }
  .sheet-head {
    height: 34px;
    display: flex;
    align-items: center;
    padding: 0 20px;
    flex: none;
  }
  .sheet-head .label {
    color: var(--primary);
    font-size: 12px;
    font-weight: 650;
    letter-spacing: .02em;
  }
  .close {
    margin-left: auto;
    width: 34px;
    height: 34px;
    border: 0;
    background: transparent;
    border-radius: 50%;
    display: grid;
    place-items: center;
    color: var(--text);
  }

  /* hero */
  .hero {
    position: relative;
    flex: none;
    height: 214px;
    margin: 4px 16px 0;
    border-radius: 24px;
    overflow: hidden;
    background: var(--hero);
    isolation: isolate;
  }
  .still {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }
  body[data-state="blur"] .still {
    filter: blur(15px) brightness(1.42) saturate(1.06);
    transform: scale(1.12);
  }
  .hero-top {
    position: absolute;
    inset: 10px 10px auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .hero-chip, .hero-circle {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border: 0;
    color: white;
    background: rgba(10, 8, 16, .42);
    backdrop-filter: blur(8px);
  }
  .hero-chip {
    height: 28px;
    padding: 0 10px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 650;
    letter-spacing: .04em;
  }
  .hero-circle {
    width: 34px;
    height: 34px;
    border-radius: 50%;
  }
  .hero-circle .i { width: 18px; height: 18px; }
  .play {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 58px;
    height: 58px;
    transform: translate(-50%, -50%);
    border: 0;
    border-radius: 50%;
    background: rgba(255, 255, 255, .94);
    color: #15131a;
    display: grid;
    place-items: center;
    box-shadow: 0 6px 20px rgba(0, 0, 0, .20);
  }
  .play .i { width: 30px; height: 30px; }
  body[data-state="playing"] .icon-play { display: none; }
  body:not([data-state="playing"]) .icon-pause { display: none; }
  .video-meta {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    padding: 30px 14px 10px;
    color: white;
    background: linear-gradient(to top, rgba(0, 0, 0, .78), transparent);
  }
  .times {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 11px;
    line-height: 16px;
    font-variant-numeric: tabular-nums;
  }
  .times .total { margin-left: auto; color: rgba(255, 255, 255, .72); }
  .times .i { width: 16px; height: 16px; color: rgba(255, 255, 255, .9); stroke-width: 2; }
  .track {
    height: 3px;
    margin-top: 6px;
    border-radius: 99px;
    background: rgba(255, 255, 255, .28);
    overflow: hidden;
  }
  .track > i {
    display: block;
    height: 100%;
    border-radius: inherit;
    background: white;
  }
  .track > i { width: 7%; }

  /* document hero */
  .doc-hero { display: none; background: linear-gradient(135deg, #e8defa, #f2edf8); }
  body[data-state="document"] .hero { background: linear-gradient(135deg, #e8defa, #f2edf8); }
  body[data-state="document"] .still,
  body[data-state="document"] .hero-top,
  body[data-state="document"] .play,
  body[data-state="document"] .video-meta { display: none; }
  body[data-state="document"] .doc-hero { display: flex; }
  .doc-hero {
    position: absolute;
    inset: 0;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    color: var(--muted);
  }
  .doc-card {
    width: 78px;
    height: 78px;
    border-radius: 22px;
    background: rgba(255, 255, 255, .78);
    box-shadow: 0 4px 18px rgba(61, 48, 92, .12);
    display: grid;
    place-items: center;
    position: relative;
    color: #9b3a52;
  }
  .doc-card .i { width: 38px; height: 38px; }
  .doc-card span {
    position: absolute;
    bottom: 10px;
    font-size: 8px;
    font-weight: 800;
    letter-spacing: .08em;
  }
  .doc-label { font-size: 13px; font-weight: 600; }

  /* folder / image / audio / archive / generic heroes */
  .folder-hero,
  .audio-hero,
  .archive-hero,
  .generic-hero {
    display: none;
    position: absolute;
    inset: 0;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 11px;
  }
  .folder-hero { background: linear-gradient(135deg, #e7defb, #f3eef9); }
  .archive-hero { background: linear-gradient(135deg, #ece1fa, #f7f1fb); }
  .generic-hero { background: linear-gradient(135deg, #e9e9f2, #f6f5fa); }
  .image-hero {
    display: none;
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }
  .audio-hero {
    background: linear-gradient(140deg, #272237 0%, #514266 58%, #8b6878 100%);
  }
  .hero-illustration {
    position: relative;
    width: 92px;
    height: 92px;
    border-radius: 25px;
    display: grid;
    place-items: center;
    background: rgba(255, 255, 255, .74);
    box-shadow: 0 6px 22px rgba(69, 51, 101, .13);
  }
  .hero-illustration .i { width: 46px; height: 46px; }
  .folder-hero .hero-illustration { color: #6f58a0; }
  .archive-hero .hero-illustration { color: #76509a; }
  .generic-hero .hero-illustration { color: #686b7c; }
  .hero-sub { font-size: 12px; font-weight: 600; color: rgba(50, 43, 66, .58); }
  .folder-count {
    position: absolute;
    right: -10px;
    bottom: -8px;
    min-width: 30px;
    height: 24px;
    padding: 0 7px;
    border-radius: 999px;
    background: #6f58a0;
    color: white;
    font-size: 11px;
    line-height: 24px;
    text-align: center;
    font-weight: 700;
    box-shadow: 0 3px 10px rgba(66, 48, 97, .25);
  }
  .archive-stack {
    position: relative;
    width: 112px;
    height: 96px;
  }
  .archive-stack::before,
  .archive-stack::after {
    content: "";
    position: absolute;
    inset: 8px 14px 8px 14px;
    border-radius: 20px;
    background: rgba(255, 255, 255, .42);
  }
  .archive-stack::before { transform: translate(10px, 5px) rotate(5deg); }
  .archive-stack::after { transform: translate(-9px, 7px) rotate(-5deg); }
  .archive-stack .hero-illustration {
    position: absolute;
    inset: 0;
    margin: auto;
  }
  .file-badge {
    position: absolute;
    bottom: 12px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 8px;
    font-weight: 800;
    letter-spacing: .08em;
    color: currentColor;
  }
  .audio-disc {
    position: absolute;
    left: 50%;
    top: 44%;
    width: 114px;
    height: 114px;
    border-radius: 50%;
    transform: translate(-50%, -50%);
    background:
      radial-gradient(circle at 34% 30%, rgba(255,255,255,.32), transparent 22%),
      conic-gradient(from 210deg, #b78aa4, #5d476f 36%, #241e33 68%, #a4778f);
    box-shadow: 0 12px 28px rgba(0, 0, 0, .32);
    opacity: .8;
  }
  .audio-disc::after {
    content: "";
    position: absolute;
    inset: 0;
    margin: auto;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: #17131f;
    box-shadow: 0 0 0 7px rgba(255, 255, 255, .12);
  }
  .wave {
    position: absolute;
    left: 16px;
    right: 16px;
    bottom: 44px;
    height: 66px;
    display: flex;
    align-items: flex-end;
    gap: 3px;
    opacity: .55;
  }
  .wave i {
    flex: 1;
    display: block;
    border-radius: 99px;
    background: rgba(255, 255, 255, .86);
  }

  body[data-state="document"] .still,
  body[data-state="folder"] .still,
  body[data-state="image"] .still,
  body[data-state="audio"] .still,
  body[data-state="archive"] .still,
  body[data-state="generic"] .still { display: none; }
  body[data-state="document"] .hero-top,
  body[data-state="folder"] .hero-top,
  body[data-state="archive"] .hero-top,
  body[data-state="generic"] .hero-top,
  body[data-state="blur"] .hero-top { display: none; }
  body[data-state="document"] .play,
  body[data-state="folder"] .play,
  body[data-state="image"] .play,
  body[data-state="archive"] .play,
  body[data-state="generic"] .play,
  body[data-state="blur"] .play,
  body[data-state="document"] .video-meta,
  body[data-state="folder"] .video-meta,
  body[data-state="image"] .video-meta,
  body[data-state="archive"] .video-meta,
  body[data-state="generic"] .video-meta,
  body[data-state="blur"] .video-meta { display: none; }
  body[data-state="folder"] .folder-hero { display: flex; }
  body[data-state="image"] .image-hero { display: block; }
  body[data-state="audio"] .audio-hero { display: block; }
  body[data-state="archive"] .archive-hero { display: flex; }
  body[data-state="generic"] .generic-hero { display: flex; }

  /* blurred state */
  .blur-overlay {
    display: none;
    position: absolute;
    inset: 0;
    background: rgba(10, 8, 16, .30);
    color: white;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 7px;
  }
  body[data-state="blur"] .blur-overlay { display: flex; }
  body[data-state="blur"] .play,
  body[data-state="blur"] .hero-top,
  body[data-state="blur"] .video-meta { display: none; }
  .lock-ring {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    background: rgba(255, 255, 255, .14);
    margin-bottom: 2px;
  }
  .lock-ring .i { width: 21px; height: 21px; }
  .blur-overlay strong { font-size: 13px; font-weight: 600; }
  .reveal {
    height: 32px;
    margin-top: 3px;
    padding: 0 14px;
    border: 0;
    border-radius: 999px;
    background: rgba(255, 255, 255, .18);
    color: white;
    font-size: 12px;
    font-weight: 600;
    display: inline-flex;
    align-items: center;
    gap: 5px;
  }
  .reveal .i { width: 16px; height: 16px; }

  /* info */
  .info {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    padding: 14px 16px 0 20px;
    flex: none;
  }
  .info-main { flex: 1; min-width: 0; }
  .eyebrow {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    line-height: 15px;
    color: var(--muted);
  }
  .eyebrow .type { color: var(--primary); font-weight: 650; }
  .title {
    margin-top: 2px;
    font-size: 22px;
    line-height: 28px;
    font-weight: 650;
    letter-spacing: -.015em;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .filename {
    margin-top: 1px;
    font-size: 12px;
    line-height: 17px;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .star {
    flex: none;
    width: 38px;
    height: 38px;
    border: 0;
    border-radius: 50%;
    background: var(--tile);
    display: grid;
    place-items: center;
  }
  .star .i { width: 20px; height: 20px; }
  .chips {
    display: flex;
    gap: 6px;
    padding: 10px 20px 12px;
    flex: none;
    white-space: nowrap;
  }
  .chip {
    padding: 5px 9px;
    border-radius: 999px;
    background: var(--tile);
    color: var(--muted);
    font-size: 11px;
    line-height: 15px;
    font-weight: 500;
  }
  /* actions */
  .quick {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    padding: 0 16px;
    flex: none;
  }
  .quick-tile {
    height: 72px;
    border: 0;
    border-radius: 19px;
    background: var(--tile);
    color: var(--muted);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 5px;
    font-size: 12px;
    font-weight: 550;
  }
  .quick-tile.primary {
    background: var(--primary-soft);
    color: var(--on-primary-soft);
  }
  .quick-tile .i { width: 23px; height: 23px; }
  .section-label {
    padding: 14px 20px 7px;
    color: var(--muted);
    font-size: 12px;
    line-height: 18px;
    font-weight: 600;
    flex: none;
  }
  .more-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    padding: 0 16px;
    flex: none;
  }
  .more-tile {
    height: 48px;
    border: 0;
    border-radius: 16px;
    background: var(--tile);
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 0 9px 0 12px;
    text-align: left;
  }
  .more-tile .i.lead { width: 19px; height: 19px; color: var(--muted); }
  .more-tile span {
    flex: 1;
    min-width: 0;
    font-size: 13px;
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .more-tile .i.chev {
    width: 11px;
    height: 11px;
    color: var(--muted-2);
    opacity: .65;
    stroke-width: 2.4;
  }
  .danger {
    margin: auto 16px 12px;
    height: 48px;
    border: 0;
    border-radius: 16px;
    background: var(--error-soft);
    color: var(--error);
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 0 14px;
    font-size: 13px;
    font-weight: 550;
    flex: none;
  }
  .danger .i { width: 20px; height: 20px; }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
